name: Extraer ficha desde un enlace

# Lo dispara el panel de administración de la web (admin.html → "Extraer en el
# servidor"), que llama a la API de GitHub con el token del navegador.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL del anuncio"
        required: true
      browser:
        description: "Renderizar con navegador (webs con JavaScript)"
        type: boolean
        default: false

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Instalar Chromium
        if: inputs.browser
        run: python -m playwright install --with-deps chromium

      - name: Extraer
        # la URL entra por variable de entorno, nunca interpolada en el shell
        env:
          TARGET_URL: ${{ inputs.url }}
          USE_BROWSER: ${{ inputs.browser }}
        run: |
          ARGS=""
          [ "$USE_BROWSER" = "true" ] && ARGS="--browser"
          python -m scraper.extract_link "$TARGET_URL" $ARGS | tee /tmp/ficha.json

      - name: Guardar en la base de datos
        run: |
          git config user.name  "perrita-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dogs.json data/meta.json data/exports/
          if git diff --cached --quiet; then
            echo "La ficha ya estaba igual; nada que commitear."
          else
            NAME=$(python -c "import json;print(json.load(open('/tmp/ficha.json',encoding='utf-8'))['name'])")
            git commit -m "Ficha desde enlace: $NAME"
            git push
          fi

      - name: Resumen
        if: always()
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          echo "### Extracción" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$TARGET_URL\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/ficha.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('/tmp/ficha.json', encoding='utf-8'))
          print(f"\n**{d['name']}** — encaje {d['score']}/100\n")
          for k in ('sex', 'age_months', 'size', 'breed', 'province', 'shelter'):
              print(f"- {k}: {d.get(k)}")
          PY
          fi
