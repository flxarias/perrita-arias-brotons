name: Comprobaciones

on:
  push:
    paths: ["scraper/**", "config/**", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r scraper/requirements.txt

      - name: Normalizadores y afinidad
        run: python -m scraper.selftest

      # Un SyntaxError en cualquiera de estos ficheros deja la web en
      # "Cargando…" sin mostrar nada, y desde fuera parece que el fallo está
      # en los datos. Node ya viene instalado en el runner.
      - name: La web es JavaScript válido
        run: |
          for f in assets/js/*.js; do
            node --check "$f" && echo "  ok  $f"
          done

      - name: El HTML apunta a ficheros que existen
        run: |
          python - <<'PY'
          import pathlib, re, sys
          fallos = []
          for page in ("index.html", "admin.html"):
              html = pathlib.Path(page).read_text(encoding="utf-8")
              for ref in re.findall(r'(?:src|href)="((?!https?:|data:|#|mailto:)[^"]+)"', html):
                  ref = ref.split("?")[0].split("#")[0]
                  if ref and not pathlib.Path(ref).exists():
                      fallos.append(f"{page} → {ref}")
          if fallos:
              print("referencias rotas:", *fallos, sep="\n  "); sys.exit(1)
          print("todas las referencias existen")
          PY

      - name: La base de datos es coherente
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("data/dogs.json")
          if not p.exists():
              print("todavía no hay base de datos; nada que validar"); sys.exit(0)
          db = json.loads(p.read_text(encoding="utf-8"))
          dogs = db["dogs"]
          assert db["count"] == len(dogs), "el contador no cuadra con las fichas"
          ids = [d["id"] for d in dogs]
          assert len(ids) == len(set(ids)), "hay identificadores repetidos"
          need = {"id", "source", "name", "score", "status", "first_seen"}
          for d in dogs:
              missing = need - d.keys()
              assert not missing, f"{d.get('id')} sin {missing}"
              assert 0 <= d["score"] <= 100, f"{d['id']} con encaje fuera de rango"
          print(f"{len(dogs)} fichas correctas")
          PY

      - name: Las fuentes declarativas son válidas
        run: |
          python - <<'PY'
          import json, pathlib, re
          spec = json.loads(pathlib.Path("config/sources.json").read_text(encoding="utf-8"))
          for s in spec["sources"]:
              for k in ("slug", "label", "listings", "detail_pattern"):
                  assert k in s, f"{s.get('slug')} sin '{k}'"
              re.compile(s["detail_pattern"])
              if s.get("exclude_pattern"):
                  re.compile(s["exclude_pattern"])
          json.loads(pathlib.Path("config/criteria.json").read_text(encoding="utf-8"))
          print(f"{len(spec['sources'])} fuentes declarativas correctas")
          PY
